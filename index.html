<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة سيئول المعرفية 2026</title>
<style>
html,body{margin:0;min-height:100%;background:#eef3f7}
#loading{min-height:100vh;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;color:#173f56;font-size:16px}
</style>
</head>
<body>
<div id="loading">جارٍ تحميل الصفحة…</div>
<script>
(async function(){
  try{
    const response=await fetch('app.html?v=20260726-2',{cache:'no-store'});
    if(!response.ok) throw new Error('Failed to load page source');
    let html=await response.text();

    const registrationOpen='<div class="offer-registration" id="participation-registration">';
    const registrationStart=html.indexOf(registrationOpen);
    if(registrationStart!==-1){
      const asideAfterRegistration=html.indexOf('<aside class="offer-price-panel"',registrationStart);
      if(asideAfterRegistration!==-1){
        const divTags=/<div\b[^>]*>|<\/div\s*>/gi;
        divTags.lastIndex=registrationStart;
        let depth=0;
        let registrationEnd=-1;
        let match;
        while((match=divTags.exec(html))){
          if(/^<div/i.test(match[0])) depth+=1;
          else{
            depth-=1;
            if(depth===0){
              registrationEnd=divTags.lastIndex;
              break;
            }
          }
        }
        if(registrationEnd!==-1){
          const registrationBlock=html.slice(registrationStart,registrationEnd);
          html=html.slice(0,registrationStart)+html.slice(registrationEnd);
          const asideStart=html.indexOf('<aside class="offer-price-panel"');
          const asideCloseStart=html.indexOf('</aside>',asideStart);
          if(asideCloseStart!==-1){
            const asideEnd=asideCloseStart+'</aside>'.length;
            html=html.slice(0,asideEnd)+'\n      '+registrationBlock+html.slice(asideEnd);
          }
        }
      }
    }

    const layoutStyle=`
<style id="v33-participation-layout">
/* Compact price card, full-width registration and lighter price masking */
.offer-shell{
  grid-template-columns:minmax(0,1fr) minmax(280px,320px);
  align-items:start;
}
.offer-copy{min-width:0}
.offer-price-panel{
  align-self:start;
  min-height:0;
  padding:20px 18px;
  justify-content:flex-start;
}
.offer-registration{
  grid-column:1 / -1;
  width:100%;
  min-width:0;
  margin-top:0;
  box-sizing:border-box;
}
.offer-price-value{
  filter:blur(1.8px);
  opacity:.84;
}
@media(max-width:900px){
  .offer-shell{grid-template-columns:1fr}
  .offer-price-panel,.offer-registration{grid-column:1;width:100%;max-width:none}
}
@media(max-width:640px){
  .offer-price-value{filter:blur(1.5px);opacity:.86}
}
</style>`;
    html=html.replace('</head>',layoutStyle+'\n</head>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const loading=document.getElementById('loading');
    if(loading) loading.textContent='تعذر تحميل الصفحة. حدّث الصفحة وحاول مرة أخرى.';
    console.error(error);
  }
})();
</script>
</body>
</html>
