{% capture page_source %}{% include_relative original.html %}{% endcapture %}
{% capture head_injection %}
<style id="participation-layout-v36">
/* Direct, zero-network enhancement for the participation section */
.offer-shell{
  grid-template-columns:minmax(0,1fr) minmax(248px,288px) !important;
  gap:22px !important;
  align-items:start !important;
}
.offer-copy{
  min-width:0 !important;
}
.offer-price-panel{
  align-self:start !important;
  width:100% !important;
  max-width:288px !important;
  min-height:0 !important;
  height:auto !important;
  padding:25px 19px 21px !important;
  justify-content:flex-start !important;
  border-radius:26px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
}
.offer-registration{
  grid-column:1 / -1 !important;
  width:100% !important;
  max-width:none !important;
  min-width:0 !important;
  margin-top:0 !important;
  box-sizing:border-box !important;
}
.offer-price-value{
  filter:blur(.68px) !important;
  opacity:.96 !important;
  text-shadow:0 0 8px rgba(255,255,255,.12) !important;
}
.price-soon-badge{
  position:relative !important;
  isolation:isolate !important;
  overflow:hidden !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:9px !important;
  width:max-content !important;
  max-width:100% !important;
  margin:8px auto 18px !important;
  padding:11px 18px !important;
  border:1px solid rgba(255,255,255,.92) !important;
  border-radius:999px !important;
  background:linear-gradient(135deg,#fffdf7 0%,#ffffff 55%,#fff5d8 100%) !important;
  color:#8a5b0b !important;
  box-shadow:0 10px 24px rgba(2,25,49,.2),inset 0 1px 0 rgba(255,255,255,.95) !important;
  font-weight:800 !important;
  line-height:1 !important;
  transform:rotate(-1deg) !important;
}
.price-soon-badge::before{
  content:"" !important;
  position:absolute !important;
  z-index:-1 !important;
  inset:-70% auto -70% -35% !important;
  width:34% !important;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent) !important;
  transform:skewX(-18deg) !important;
  animation:priceSoonShine 3.2s ease-in-out infinite !important;
}
.price-soon-dot{
  width:9px !important;
  height:9px !important;
  flex:0 0 9px !important;
  border-radius:50% !important;
  background:#d7a238 !important;
  box-shadow:0 0 0 0 rgba(215,162,56,.52) !important;
  animation:priceSoonPulse 1.8s ease-out infinite !important;
}
.price-soon-text{
  position:relative !important;
  z-index:1 !important;
  font-size:14px !important;
  white-space:nowrap !important;
}
@keyframes priceSoonPulse{
  0%{box-shadow:0 0 0 0 rgba(215,162,56,.52)}
  70%{box-shadow:0 0 0 11px rgba(215,162,56,0)}
  100%{box-shadow:0 0 0 0 rgba(215,162,56,0)}
}
@keyframes priceSoonShine{
  0%,55%{left:-38%;opacity:0}
  62%{opacity:.9}
  82%{left:112%;opacity:0}
  100%{left:112%;opacity:0}
}
@media(max-width:900px){
  .offer-shell{
    grid-template-columns:1fr !important;
  }
  .offer-price-panel,
  .offer-registration{
    grid-column:1 !important;
    width:100% !important;
    max-width:none !important;
  }
}
@media(max-width:640px){
  .offer-price-panel{
    padding:22px 17px 19px !important;
  }
  .offer-price-value{
    filter:blur(.48px) !important;
    opacity:.97 !important;
  }
  .price-soon-badge{
    padding:10px 16px !important;
  }
}
</style>
</head>
{% endcapture %}
{% assign page_source = page_source | replace: '</head>', head_injection %}
{% capture body_injection %}
<script id="participation-layout-script-v36">
(function(){
  function applyParticipationLayout(){
    var panel=document.querySelector('.offer-price-panel');
    var registration=document.getElementById('participation-registration');
    var shell=(panel&&panel.closest('.offer-shell'))||(registration&&registration.closest('.offer-shell'));

    if(shell&&registration){
      shell.appendChild(registration);
    }

    if(panel){
      var candidates=Array.prototype.slice.call(panel.querySelectorAll('*'));
      var badge=candidates.find(function(element){
        var text=(element.textContent||'').replace(/\s+/g,' ').trim();
        return element.children.length===0&&/قريب/.test(text)&&text.length<=45;
      });

      if(!badge){
        badge=document.createElement('div');
        var priceValue=panel.querySelector('.offer-price-value');
        if(priceValue){
          priceValue.insertAdjacentElement('beforebegin',badge);
        }else{
          panel.insertBefore(badge,panel.firstChild);
        }
      }

      badge.classList.add('price-soon-badge');
      badge.textContent='';

      var dot=document.createElement('span');
      dot.className='price-soon-dot';
      dot.setAttribute('aria-hidden','true');

      var text=document.createElement('span');
      text.className='price-soon-text';
      text.textContent='سيُعلن قريبًا';

      badge.appendChild(dot);
      badge.appendChild(text);
    }

    if(shell){
      shell.classList.add('participation-layout-ready');
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',applyParticipationLayout,{once:true});
  }else{
    applyParticipationLayout();
  }
})();
</script>
</body>
{% endcapture %}
{{ page_source | replace: '</body>', body_injection }}
