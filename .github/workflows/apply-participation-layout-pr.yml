# One-time layout patch trigger
name: Apply participation layout patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/apply-participation-layout-pr.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-layout:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refine participation section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          registration_open = '<div class="offer-registration" id="participation-registration">'
          registration_start = html.find(registration_open)
          if registration_start == -1:
              raise SystemExit("Participation registration block was not found")

          aside_start = html.find('<aside class="offer-price-panel"', registration_start)
          if aside_start != -1:
              token_pattern = re.compile(r'<div\b[^>]*>|</div\s*>', re.IGNORECASE)
              depth = 0
              registration_end = None
              for match in token_pattern.finditer(html, registration_start):
                  token = match.group(0).lower()
                  if token.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          registration_end = match.end()
                          break

              if registration_end is None:
                  raise SystemExit("Could not determine the end of the registration block")

              registration_block = html[registration_start:registration_end]
              html = html[:registration_start] + html[registration_end:]

              aside_start = html.find('<aside class="offer-price-panel"')
              aside_end = html.find('</aside>', aside_start)
              if aside_end == -1:
                  raise SystemExit("Price panel closing tag was not found")
              aside_end += len('</aside>')
              html = html[:aside_end] + "\n      " + registration_block + html[aside_end:]

          marker = 'id="v33-participation-layout"'
          if marker not in html:
              style = r'''
<style id="v33-participation-layout">
/* Compact price card, full-width registration and lighter price masking */
.offer-shell{
  grid-template-columns:minmax(0,1fr) minmax(270px,330px);
  align-items:start;
}
.offer-copy{min-width:0}
.offer-price-panel{
  align-self:start;
  min-height:0;
  padding:20px 18px;
  justify-content:flex-start;
}
.offer-registration{
  grid-column:1 / -1;
  width:100%;
  min-width:0;
  margin-top:0;
  box-sizing:border-box;
}
.offer-price-value{
  filter:blur(2px);
  opacity:.82;
}
@media(max-width:900px){
  .offer-shell{grid-template-columns:1fr}
  .offer-price-panel,.offer-registration{grid-column:1;width:100%;max-width:none}
}
@media(max-width:640px){
  .offer-price-value{filter:blur(1.7px);opacity:.84}
}
</style>
'''
              if '</head>' not in html:
                  raise SystemExit("Closing head tag was not found")
              html = html.replace('</head>', style + '\n</head>', 1)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-participation-layout-pr.yml
          rm -f .github/workflows/adjust-participation-layout.yml

      - name: Commit patch to pull request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine participation pricing and registration layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
