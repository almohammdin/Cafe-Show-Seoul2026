name: Finalize admin separation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-admin-separation.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide operational sections from the public route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'v31-admin-route-separation'
          if marker not in html:
              css = '''
          <style id="v31-admin-route-separation">
          /* Operational content lives only on /admin.html -> ?admin=1 */
          body:not(.admin-route) #flights,
          body:not(.admin-route) #lodging,
          body:not(.admin-route) #program-admin,
          body:not(.admin-route) #suggestions,
          body:not(.admin-route) #sponsors,
          body:not(.admin-route) #followups,
          body:not(.admin-route) #finance,
          body:not(.admin-route) .admin-only-nav{display:none!important}
          </style>
          '''
              if '</head>' not in html:
                  raise SystemExit('Could not locate </head>')
              html = html.replace('</head>', css + '\n</head>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit final separation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Keep operational tools inside the admin route"
          git push
