name: Restore participation section layout
# Trigger the one-time repair after the workflow exists on main.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-participation-layout.yml

permissions:
  contents: write

jobs:
  restore-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore compact price card and full-width registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          registration_open = '<div class="offer-registration" id="participation-registration">'
          registration_start = html.find(registration_open)
          if registration_start == -1:
              raise SystemExit('Participation registration block was not found')

          aside_after_registration = html.find('<aside class="offer-price-panel"', registration_start)
          if aside_after_registration != -1:
              token_pattern = re.compile(r'<div\b[^>]*>|</div\s*>', re.IGNORECASE)
              depth = 0
              registration_end = None
              for match in token_pattern.finditer(html, registration_start):
                  token = match.group(0).lower()
                  if token.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          registration_end = match.end()
                          break

              if registration_end is None:
                  raise SystemExit('Could not determine registration block end')

              registration_block = html[registration_start:registration_end]
              html = html[:registration_start] + html[registration_end:]

              aside_start = html.find('<aside class="offer-price-panel"')
              aside_close = html.find('</aside>', aside_start)
              if aside_start == -1 or aside_close == -1:
                  raise SystemExit('Price panel was not found')
              aside_end = aside_close + len('</aside>')
              html = html[:aside_end] + '\n      ' + registration_block + html[aside_end:]

          marker = 'id="v34-participation-layout"'
          if marker not in html:
              style = r'''
<style id="v34-participation-layout">
/* Compact price panel, balanced content area, full-width registration */
.offer-shell{
  grid-template-columns:minmax(0,1fr) minmax(280px,320px) !important;
  align-items:start !important;
}
.offer-copy{min-width:0}
.offer-price-panel{
  align-self:start !important;
  min-height:0 !important;
  padding:20px 18px !important;
  justify-content:flex-start !important;
  border-radius:24px !important;
}
.offer-registration{
  grid-column:1 / -1 !important;
  width:100% !important;
  max-width:none !important;
  min-width:0 !important;
  margin-top:0 !important;
  box-sizing:border-box !important;
}
.offer-price-value{
  filter:blur(1.6px) !important;
  opacity:.88 !important;
}
@media(max-width:900px){
  .offer-shell{grid-template-columns:1fr !important}
  .offer-price-panel,.offer-registration{
    grid-column:1 !important;
    width:100% !important;
    max-width:none !important;
  }
}
@media(max-width:640px){
  .offer-price-value{filter:blur(1.35px) !important;opacity:.9 !important}
}
</style>
'''
              if '</head>' not in html:
                  raise SystemExit('Closing head tag was not found')
              html = html.replace('</head>', style + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/restore-participation-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-participation-layout.yml
          git commit -m "Restore participation section layout"
          git push
