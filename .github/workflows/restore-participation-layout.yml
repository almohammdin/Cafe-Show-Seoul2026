name: Apply participation layout fix

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Apply Seoul participation layout fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the final participation layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          registration_open = '<div class="offer-registration" id="participation-registration">'
          registration_start = html.find(registration_open)
          if registration_start == -1:
              raise SystemExit('Participation registration block was not found')

          # Move the registration block outside the two-column content area so it spans the full section.
          aside_after_registration = html.find('<aside class="offer-price-panel"', registration_start)
          if aside_after_registration != -1:
              div_tags = re.compile(r'<div\b[^>]*>|</div\s*>', re.IGNORECASE)
              depth = 0
              registration_end = None
              for match in div_tags.finditer(html, registration_start):
                  token = match.group(0).lower()
                  if token.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          registration_end = match.end()
                          break

              if registration_end is None:
                  raise SystemExit('Could not determine registration block end')

              registration_block = html[registration_start:registration_end]
              html = html[:registration_start] + html[registration_end:]

              aside_start = html.find('<aside class="offer-price-panel"')
              aside_close = html.find('</aside>', aside_start)
              if aside_start == -1 or aside_close == -1:
                  raise SystemExit('Price panel was not found')
              aside_end = aside_close + len('</aside>')
              html = html[:aside_end] + '\n      ' + registration_block + html[aside_end:]

          # Replace the old badge wording only inside the price panel and add an animated indicator.
          aside_start = html.find('<aside class="offer-price-panel"')
          aside_close = html.find('</aside>', aside_start)
          if aside_start == -1 or aside_close == -1:
              raise SystemExit('Price panel was not found after layout move')
          aside_end = aside_close + len('</aside>')
          aside_html = html[aside_start:aside_end]

          badge_markup = '<span class="price-soon-dot" aria-hidden="true"></span><span class="price-soon-text">سيُعلن قريبًا</span>'
          patterns = [
              r'الإعلان\s+قريب(?:ًا|اً|ا)?',
              r'سيعلن\s+قريب(?:ًا|اً|ا)?',
              r'قريب(?:ًا|اً|ا)?'
          ]
          replaced = False
          for pattern in patterns:
              updated, count = re.subn(pattern, badge_markup, aside_html, count=1)
              if count:
                  aside_html = updated
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('The existing soon badge text was not found')

          html = html[:aside_start] + aside_html + html[aside_end:]

          # Remove prior one-time overrides if they exist, then add the final direct CSS override.
          html = re.sub(r'\s*<style id="v3[34]-participation-layout">.*?</style>\s*', '\n', html, flags=re.DOTALL)

          style = r'''
<style id="v35-participation-layout">
/* Final participation layout: compact pricing, full-width registration, soft masking */
.offer-shell{
  grid-template-columns:minmax(0,1fr) minmax(250px,292px) !important;
  gap:22px !important;
  align-items:start !important;
}
.offer-copy{min-width:0 !important}
.offer-price-panel{
  align-self:start !important;
  width:100% !important;
  max-width:292px !important;
  min-height:0 !important;
  height:auto !important;
  padding:24px 18px 20px !important;
  justify-content:flex-start !important;
  border-radius:26px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
}
.offer-registration{
  grid-column:1 / -1 !important;
  width:100% !important;
  max-width:none !important;
  min-width:0 !important;
  margin-top:0 !important;
  box-sizing:border-box !important;
}
.offer-price-value{
  filter:blur(.72px) !important;
  opacity:.96 !important;
  text-shadow:0 0 8px rgba(255,255,255,.12) !important;
}
.offer-price-panel *:has(> .price-soon-dot){
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:9px !important;
  padding:10px 17px !important;
  margin:8px auto 18px !important;
  width:max-content !important;
  max-width:100% !important;
  border-radius:999px !important;
  color:#8b5d0c !important;
  background:linear-gradient(135deg,#fffdf7 0%,#ffffff 58%,#fff7df 100%) !important;
  border:1px solid rgba(255,255,255,.92) !important;
  box-shadow:0 10px 24px rgba(3,27,52,.18),inset 0 1px 0 rgba(255,255,255,.92) !important;
  font-weight:800 !important;
  line-height:1 !important;
  transform:rotate(-1.2deg) !important;
}
.price-soon-dot{
  width:9px !important;
  height:9px !important;
  flex:0 0 9px !important;
  border-radius:50% !important;
  background:#d8a333 !important;
  box-shadow:0 0 0 0 rgba(216,163,51,.5) !important;
  animation:priceSoonPulse 1.8s ease-out infinite !important;
}
.price-soon-text{
  font-size:14px !important;
  white-space:nowrap !important;
}
@keyframes priceSoonPulse{
  0%{box-shadow:0 0 0 0 rgba(216,163,51,.5)}
  70%{box-shadow:0 0 0 11px rgba(216,163,51,0)}
  100%{box-shadow:0 0 0 0 rgba(216,163,51,0)}
}
@media(max-width:900px){
  .offer-shell{grid-template-columns:1fr !important}
  .offer-price-panel{
    grid-column:1 !important;
    width:100% !important;
    max-width:none !important;
  }
  .offer-registration{
    grid-column:1 !important;
    width:100% !important;
    max-width:none !important;
  }
}
@media(max-width:640px){
  .offer-price-value{filter:blur(.52px) !important;opacity:.97 !important}
  .offer-price-panel{padding:22px 17px 19px !important}
}
</style>
'''
          if '</head>' not in html:
              raise SystemExit('Closing head tag was not found')
          html = html.replace('</head>', style + '\n</head>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit the direct page update
        shell: bash
        run: |
          rm -f .github/workflows/restore-participation-layout.yml
          rm -f api-blob-link.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize compact participation layout"
          git push origin main
