name: Apply final page update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-final-page-update.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested page changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          marker='v32-final-page-update'
          if marker in html:
              raise SystemExit('Patch already applied')

          def section_bounds(src, section_id):
              m=re.search(r'<section\b[^>]*\bid=["\']'+re.escape(section_id)+r'["\'][^>]*>',src,re.I)
              if not m:return None
              depth=0
              for t in re.finditer(r'</?section\b[^>]*>',src[m.start():],re.I):
                  tag=t.group(0).lower()
                  depth += -1 if tag.startswith('</section') else 1
                  if depth==0:return m.start(),m.start()+t.end()
              raise RuntimeError(f'Unclosed section: {section_id}')

          def remove_section(src, section_id):
              b=section_bounds(src,section_id)
              return src if not b else src[:b[0]]+src[b[1]:]

          def replace_section(src, section_id, replacement):
              b=section_bounds(src,section_id)
              if not b:raise RuntimeError(f'Missing section: {section_id}')
              return src[:b[0]]+replacement+src[b[1]:]

          def element_bounds_by_class(src, tag, class_name):
              m=re.search(r'<'+tag+r'\b(?=[^>]*\bclass=["\'][^"\']*\b'+re.escape(class_name)+r'\b[^"\']*["\'])[^>]*>',src,re.I)
              if not m:return None
              depth=0
              for t in re.finditer(r'</?'+tag+r'\b[^>]*>',src[m.start():],re.I):
                  current=t.group(0).lower()
                  depth += -1 if current.startswith('</'+tag) else 1
                  if depth==0:return m.start(),m.start()+t.end(),m.end(),m.start()+t.start()
              raise RuntimeError(f'Unclosed element: {class_name}')

          def function_bounds(src,name):
              m=re.search(r'function\s+'+re.escape(name)+r'\s*\(',src)
              if not m:return None
              brace=src.find('{',m.end())
              if brace<0:return None
              depth=0;quote=None;escaped=False
              for i in range(brace,len(src)):
                  c=src[i]
                  if quote:
                      if escaped:escaped=False
                      elif c=='\\':escaped=True
                      elif c==quote:quote=None
                      continue
                  if c in ('"',"'",'`'):
                      quote=c;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return m.start(),i+1
              raise RuntimeError(f'Unclosed function: {name}')

          def replace_function(src,name,replacement):
              b=function_bounds(src,name)
              if not b:raise RuntimeError(f'Missing function: {name}')
              return src[:b[0]]+replacement+src[b[1]:]

          # Remove the standalone registration section and its navigation tab.
          html=remove_section(html,'registration')
          html=re.sub(r'<a\b(?=[^>]*href=["\']#registration["\'])[^>]*>.*?</a>','',html,flags=re.I|re.S)

          # Merge the registration form inside the participation offer.
          registration_block='''
                  <div class="offer-registration" id="participation-registration">
                    <div class="offer-registration-head">
                      <div><h3>التسجيل والتواصل</h3><p>سجل بياناتك الأساسية، ثم أرسل طلب المشاركة مباشرة عبر واتساب.</p></div>
                      <span>اهتمام مبدئي</span>
                    </div>
                    <form class="registration-form offer-registration-form" id="tripRegistrationForm">
                      <div class="registration-grid offer-registration-grid">
                        <div class="registration-field"><label for="regName">الاسم</label><input id="regName" autocomplete="name"></div>
                        <div class="registration-field"><label for="regBusiness">المنشأة أو الشركة</label><input id="regBusiness" autocomplete="organization"></div>
                        <div class="registration-field"><label for="regCity">المدينة</label><input id="regCity" autocomplete="address-level2"></div>
                        <div class="registration-field"><label for="regMobile">رقم الجوال</label><input id="regMobile" dir="ltr" inputmode="tel" autocomplete="tel"></div>
                      </div>
                      <div class="registration-actions offer-registration-actions">
                        <button class="registration-submit" type="submit" aria-label="التسجيل والتواصل عبر واتساب">
                          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.84 9.84 0 0 0-8.42 14.91L2 22l5.22-1.58A9.86 9.86 0 1 0 12.04 2Zm0 17.92a8.06 8.06 0 0 1-4.11-1.13l-.29-.17-3.1.94.96-3.02-.19-.31a8.06 8.06 0 1 1 6.73 3.69Zm4.42-6.04c-.24-.12-1.43-.71-1.65-.79-.22-.08-.38-.12-.54.12-.16.24-.62.79-.76.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.39 1.37.5.58.18 1.1.16 1.51.1.46-.07 1.43-.58 1.63-1.15.2-.56.2-1.04.14-1.15-.06-.1-.22-.16-.46-.28Z"/></svg>
                          <span>التسجيل والتواصل عبر واتساب</span>
                        </button>
                      </div>
                    </form>
                  </div>
          '''
          offer=element_bounds_by_class(html,'div','offer-copy')
          if not offer:raise RuntimeError('Missing offer-copy')
          html=html[:offer[3]]+registration_block+html[offer[3]:]
          html=html.replace('href="#registration"','href="#participation-registration"')
          html=html.replace("href='#registration'","href='#participation-registration'")

          # Remove the temporary preview and use the detailed admin program only when explicitly published.
          html=remove_section(html,'program-preview-2026')
          public_program='''
          <section id="public-program" class="published-program-section" hidden="hidden" aria-hidden="true">
            <div class="section-head published-program-head">
              <div><h2>برنامج الرحلة</h2><p>الجدول التفصيلي المعتمد والمنشور من إدارة البرنامج.</p></div>
              <span class="published-program-badge">برنامج معتمد</span>
            </div>
            <div class="public-program-published-grid" id="publicProgramDays"></div>
          </section>
          '''
          html=replace_section(html,'public-program',public_program)

          # Public footer link to the protected admin route.
          if 'id="publicAdminLink"' not in html:
              old='<div class="admin-footer-controls"><button class="admin-access-btn" id="adminAccessBtn"'
              new='<div class="admin-footer-controls"><a class="public-admin-link" id="publicAdminLink" href="https://almohammdin.github.io/Cafe-Show-Seoul2026/?admin=1">إدارة البرنامج</a><button class="admin-access-btn" id="adminAccessBtn"'
              if old not in html:raise RuntimeError('Missing footer admin controls')
              html=html.replace(old,new,1)

          # Publish/unpublish control in the admin program section.
          if 'id="programPublishToggle"' not in html:
              old='<div class="section-actions program-export-actions"><button class="share-action" id="shareProgramAll"'
              new='<div class="section-actions program-export-actions"><span class="program-publish-status" id="programPublishStatus">غير منشور</span><button class="program-publish-toggle" id="programPublishToggle" type="button">نشر في الصفحة العامة</button><button class="share-action" id="shareProgramAll"'
              if old not in html:raise RuntimeError('Missing program actions')
              html=html.replace(old,new,1)

          css='''
          <style id="v32-final-page-update">
          .offer-shell{grid-template-columns:1.18fr .82fr}
          .offer-registration{margin-top:22px;padding:17px;border:1px solid #d9e4ec;border-radius:19px;background:rgba(255,255,255,.82);box-shadow:0 8px 22px rgba(7,29,56,.055)}
          .offer-registration-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
          .offer-registration-head h3{margin:0 0 4px;color:var(--navy);font-size:18px}.offer-registration-head p{margin:0;color:#627181;font-size:12px}
          .offer-registration-head>span{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:#eef4f8;color:#315269;font-size:10px;font-weight:900}
          .offer-registration-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
          .offer-registration-actions{margin-top:12px}.offer-registration-actions .registration-submit{width:100%;justify-content:center}
          .public-admin-link{display:inline-flex;align-items:center;justify-content:center;min-height:35px;padding:7px 13px;border:1px solid #cad7e1;border-radius:10px;background:#f5f8fa;color:#173f56;text-decoration:none;font-size:12px;font-weight:800;transition:.18s ease}
          .public-admin-link:hover{background:#eaf1f5;border-color:#aebfcb;color:#0b2d49;text-decoration:none}body.admin-route .public-admin-link{display:none!important}
          .program-publish-toggle{min-height:34px;padding:7px 12px;border:1px solid #21785f;border-radius:10px;background:#e7f5ef;color:#126047;font:inherit;font-size:11.5px;font-weight:900;cursor:pointer}
          .program-publish-toggle.is-published{border-color:#9a3348;background:#fff0f3;color:#82233a}.program-publish-toggle:disabled{opacity:.5;cursor:not-allowed}
          .program-publish-status{display:inline-flex;align-items:center;min-height:29px;padding:5px 9px;border-radius:999px;background:#eef2f5;color:#617181;font-size:10px;font-weight:900}.program-publish-status.is-published{background:#e4f4ed;color:#17664f}
          body:not(.admin-mode) #programPublishToggle,body:not(.admin-mode) #programPublishStatus{display:none!important}
          body.admin-mode #public-program{display:none!important}
          .published-program-section{padding-top:28px}.published-program-head{align-items:center}.published-program-head>div>p{margin:4px 0 0;color:#637282;font-size:12px}.published-program-badge{padding:6px 11px;border-radius:999px;background:#e6f5ef;color:#17694f;font-size:11px;font-weight:900}
          .public-program-published-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.published-day-card{padding:18px;border:1px solid #d9e4ec;border-radius:19px;background:#fff;box-shadow:0 8px 22px rgba(7,29,56,.06)}.published-day-card h3{margin:0 0 11px;color:var(--navy);font-size:18px}.published-event{display:grid;grid-template-columns:60px 1fr;gap:5px 11px;padding:10px 0;border-top:1px solid #edf1f4}.published-event:first-of-type{border-top:0}.published-event-time{grid-row:1/4;color:#0c607c;font-size:12px;font-weight:900;direction:ltr;text-align:right}.published-event-title{color:#1d3348;font-size:13px;font-weight:900}.published-event-details,.published-event-place{color:#647383;font-size:11.5px;line-height:1.65}.published-event-place a{color:#17668a;text-decoration:none}
          .highlight-order-controls{display:inline-flex;gap:4px}.highlight-order-btn{display:grid;place-items:center;width:31px;height:29px;border:1px solid #ccd8e1;border-radius:8px;background:#f5f8fa;color:#23445c;font-size:14px;font-weight:900;cursor:pointer}.highlight-order-btn:disabled{opacity:.32;cursor:not-allowed}.highlight-order-btn:hover:not(:disabled){background:#e8f0f5}
          @media(max-width:900px){.offer-shell{grid-template-columns:1fr}.public-program-published-grid{grid-template-columns:1fr}}
          @media(max-width:640px){.offer-registration-grid{grid-template-columns:1fr}.offer-registration-head{display:block}.offer-registration-head>span{display:inline-flex;margin-top:9px}.published-event{grid-template-columns:52px 1fr}}
          </style>
          '''
          if '</head>' not in html:raise RuntimeError('Missing </head>')
          html=html.replace('</head>',css+'\n</head>',1)

          # State and Firebase payload support for publication status.
          html=html.replace('const DEFAULT_STATE={"program":[]','const DEFAULT_STATE={"programPublished":false,"program":[]',1)
          html=html.replace('let state=load();state.program=safeArray(state.program);','let state=load();state.programPublished=Boolean(state.programPublished);state.program=safeArray(state.program);',1)
          old_payload='function publicPayload(){return {program:safeArray(state.program),suggestions:safeArray(state.suggestions),flights:safeArray(state.flights),lodging:safeArray(state.lodging),highlights:safeArray(state.highlights),exhibitors:safeArray(state.exhibitors),updatedAt:serverTimestamp()}}'
          new_payload='function publicPayload(){return {programPublished:Boolean(state.programPublished),program:safeArray(state.program),suggestions:safeArray(state.suggestions),flights:safeArray(state.flights),lodging:safeArray(state.lodging),highlights:safeArray(state.highlights),exhibitors:safeArray(state.exhibitors),updatedAt:serverTimestamp()}}'
          if old_payload not in html:raise RuntimeError('Missing publicPayload')
          html=html.replace(old_payload,new_payload,1)

          old_normalize='function normalizePublic(remote){const base=clone(DEFAULT_STATE);return {program:Array.isArray(remote?.program)?remote.program:base.program,suggestions:Array.isArray(remote?.suggestions)?remote.suggestions:base.suggestions,flights:Array.isArray(remote?.flights)?remote.flights:base.flights,lodging:Array.isArray(remote?.lodging)?remote.lodging:base.lodging,highlights:Array.isArray(remote?.highlights)?remote.highlights:base.highlights,exhibitors:Array.isArray(remote?.exhibitors)?remote.exhibitors:base.exhibitors}}'
          new_normalize='function normalizePublic(remote){const base=clone(DEFAULT_STATE);return {programPublished:Boolean(remote?.programPublished),program:Array.isArray(remote?.program)?remote.program:base.program,suggestions:Array.isArray(remote?.suggestions)?remote.suggestions:base.suggestions,flights:Array.isArray(remote?.flights)?remote.flights:base.flights,lodging:Array.isArray(remote?.lodging)?remote.lodging:base.lodging,highlights:Array.isArray(remote?.highlights)?remote.highlights:base.highlights,exhibitors:Array.isArray(remote?.exhibitors)?remote.exhibitors:base.exhibitors}}'
          if old_normalize not in html:raise RuntimeError('Missing normalizePublic')
          html=html.replace(old_normalize,new_normalize,1)

          # Highlight ordering controls.
          render_highlights='''function renderHighlights(){const host=document.getElementById('highlightGrid');if(!host)return;host.innerHTML=state.highlights.map((r,i)=>`<article class="experience-card"><div class="admin-card-actions">${isAdmin?`<span class="highlight-order-controls"><button class="highlight-order-btn" data-highlight-move="-1" data-index="${i}" type="button" title="تحريك البطاقة للأعلى" ${i===0?'disabled':''}>↑</button><button class="highlight-order-btn" data-highlight-move="1" data-index="${i}" type="button" title="تحريك البطاقة للأسفل" ${i===state.highlights.length-1?'disabled':''}>↓</button></span><button data-edit="highlights" data-index="${i}" type="button">تعديل</button>`:''}</div><div class="experience-visual">${imageOrPlaceholder(r.image,r.titleAr)}</div><div class="experience-body"><h3 class="experience-name">${esc(r.titleAr)}${r.titleEn?`<span class="experience-en">${esc(r.titleEn)}</span>`:''}</h3><p>${esc(r.summary)}</p>${r.link?`<a class="experience-link" href="${esc(r.link)}" rel="noopener" target="_blank">${esc(r.linkLabel||'عرض التفاصيل')}</a>`:''}</div></article>`).join('')||'<div class="experience-empty">ستظهر البطاقات بعد إضافتها من لوحة الإدارة.</div>';if(isAdmin)host.querySelectorAll('[data-highlight-move]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const from=Number(btn.dataset.index),delta=Number(btn.dataset.highlightMove),to=from+delta;if(!Number.isInteger(from)||!Number.isInteger(to)||to<0||to>=state.highlights.length)return;const [item]=state.highlights.splice(from,1);state.highlights.splice(to,0,item);save();renderHighlights();toast('تم حفظ ترتيب الأنشطة')}))}'''
          html=replace_function(html,'renderHighlights',render_highlights)

          # Public detailed program renderer and admin publication UI.
          public_functions='''
          function renderPublicProgram(){
            const section=document.getElementById('public-program'),host=document.getElementById('publicProgramDays');
            if(!section||!host)return;
            const published=Boolean(state.programPublished)&&safeArray(state.program).length>0;
            section.hidden=!published;section.setAttribute('aria-hidden',published?'false':'true');
            if(!published){host.innerHTML='';return}
            host.innerHTML=DAYS.map(day=>{const rows=getOrderedProgramRows(day);if(!rows.length)return'';return `<article class="published-day-card"><h3>${esc(day)}</h3>${rows.map(({r})=>`<div class="published-event"><span class="published-event-time">${esc(r.time||'—')}</span><strong class="published-event-title">${esc(r.title||'')}</strong>${r.details?`<span class="published-event-details">${esc(r.details)}</span>`:''}${r.place?`<span class="published-event-place">${r.maps?`<a href="${esc(r.maps)}" target="_blank" rel="noopener">${esc(r.place)}</a>`:esc(r.place)}</span>`:''}</div>`).join('')}</article>`}).join('');
          }
          function updateProgramPublishUI(){
            const btn=document.getElementById('programPublishToggle'),status=document.getElementById('programPublishStatus');
            const published=Boolean(state.programPublished);
            if(btn){btn.textContent=published?'إخفاء من الصفحة العامة':'نشر في الصفحة العامة';btn.classList.toggle('is-published',published);btn.disabled=!isAdmin}
            if(status){status.textContent=published?'منشور في الصفحة العامة':'غير منشور';status.classList.toggle('is-published',published)}
          }
          function bindProgramPublishControl(){
            const btn=document.getElementById('programPublishToggle');if(!btn||btn.dataset.bound==='1')return;btn.dataset.bound='1';
            btn.addEventListener('click',()=>{if(!isAdmin)return;state.programPublished=!Boolean(state.programPublished);save();renderPublicProgram();updateProgramPublishUI();toast(state.programPublished?'تم نشر برنامج الرحلة في الصفحة العامة':'تم إخفاء برنامج الرحلة من الصفحة العامة')});
          }
          '''
          render_all_old='function renderAll(){renderLegend();renderProgram();renderFlights();renderLodging();renderHighlights();renderExhibitors();renderSuggestionFilters();renderSuggestions();renderSponsors();renderFollowups();renderFinance()}'
          render_all_new=public_functions+'\nfunction renderAll(){renderLegend();renderProgram();renderPublicProgram();renderFlights();renderLodging();renderHighlights();renderExhibitors();renderSuggestionFilters();renderSuggestions();renderSponsors();renderFollowups();renderFinance();updateProgramPublishUI();bindProgramPublishControl()}'
          if render_all_old not in html:raise RuntimeError('Missing renderAll')
          html=html.replace(render_all_old,render_all_new,1)

          path.write_text(html,encoding='utf-8')
          PY

      - name: Remove temporary inspection files
        shell: bash
        run: |
          rm -f _index-map.txt _targets.txt _targets-clean.txt _logic.txt _render-functions.txt
          rm -f .github/workflows/extract-index-map.yml
          rm -f .github/workflows/extract-targets.yml
          rm -f .github/workflows/extract-targets-clean.yml
          rm -f .github/workflows/extract-logic.yml
          rm -f .github/workflows/extract-render-functions.yml
          rm -f .github/workflows/apply-public-improvements.yml
          rm -f .github/workflows/finalize-admin-separation.yml
          rm -f .github/workflows/apply-final-page-update.yml

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge registration and add program publishing controls"
          git push
