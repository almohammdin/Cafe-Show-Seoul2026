name: Validate final page update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-final-page.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure and JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          checks={
            'merged registration form': html.count('id="tripRegistrationForm"')==1 and 'id="participation-registration"' in html,
            'standalone registration removed': not re.search(r'<section\b[^>]*id=["\']registration["\']',html,re.I),
            'registration nav removed': 'href="#registration"' not in html and "href='#registration'" not in html,
            'preview removed': 'id="program-preview-2026"' not in html,
            'public program exists': 'id="publicProgramDays"' in html,
            'admin footer link exists': 'id="publicAdminLink"' in html,
            'publish control exists': 'id="programPublishToggle"' in html,
            'publication state exists': 'programPublished' in html,
            'highlight ordering exists': 'data-highlight-move' in html,
            'final style exists': 'v32-final-page-update' in html,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('Failed checks: '+', '.join(failed))
          scripts=re.findall(r'<script\b[^>]*type=["\']module["\'][^>]*>(.*?)</script>',html,re.I|re.S)
          if not scripts: raise SystemExit('No module scripts found')
          for i,code in enumerate(scripts): Path(f'/tmp/module-{i}.mjs').write_text(code,encoding='utf-8')
          Path('/tmp/module-count').write_text(str(len(scripts)))
          PY
          count=$(cat /tmp/module-count)
          for i in $(seq 0 $((count-1))); do node --check "/tmp/module-$i.mjs"; done
          printf 'Final page validation passed.\n' > .github/final-page-validation.txt

      - name: Commit validation marker and remove validation workflow
        shell: bash
        run: |
          rm -f .github/workflows/validate-final-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Confirm final page validation"
          git push
