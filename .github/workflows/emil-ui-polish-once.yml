name: Apply Emil UI polish once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch page
        run: python3 .github/apply_emil_polish.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/emil-ui-polish-once.yml .github/apply_emil_polish.py
          git add index.html
          git commit -m "Apply Emil-style UI polish"
          git push origin main
