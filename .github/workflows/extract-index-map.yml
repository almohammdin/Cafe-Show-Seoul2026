name: Extract index structure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-index-map.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact index map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          out = []
          out.append('SECTIONS')
          for m in re.finditer(r'<section\b[^>]*>', html, re.I):
              tag = m.group(0)
              s = max(0, m.start()-180)
              e = min(len(html), m.end()+260)
              snippet = re.sub(r'\s+', ' ', html[s:e])
              out.append(snippet)

          out.append('\nHEADINGS AND TARGET TEXT')
          targets = ['معلومات عامة','التسجيل','برنامج الرحلة','أبرز أنشطة وبرامج الرحلة','ملامح البرنامج المهني والمعرفي','إدارة البرنامج','الادارة','الإدارة','footer','adminAccessBtn','program-public','program-admin','trip-highlights']
          for t in targets:
              out.append(f'--- {t} ---')
              for m in re.finditer(re.escape(t), html, re.I):
                  s = max(0, m.start()-350)
                  e = min(len(html), m.end()+650)
                  out.append(re.sub(r'\s+', ' ', html[s:e]))

          out.append('\nBUTTONS')
          for m in re.finditer(r'<button\b[^>]*>.*?</button>', html, re.I|re.S):
              text = re.sub(r'<[^>]+>', ' ', m.group(0))
              text = re.sub(r'\s+', ' ', text).strip()
              if any(x in text for x in ['نشر','ترتيب','برنامج','إدارة','الادارة','الإدارة']):
                  out.append(re.sub(r'\s+', ' ', m.group(0)))

          out.append('\nSCRIPTS RELEVANT')
          for key in ['renderProgram','renderHighlights','saveProgram','programItems','tripHighlights','sort','order','publish']:
              out.append(f'--- {key} ---')
              for m in re.finditer(key, html, re.I):
                  s = max(0, m.start()-500)
                  e = min(len(html), m.end()+1000)
                  out.append(re.sub(r'\s+', ' ', html[s:e]))

          Path('_index-map.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _index-map.txt
          git commit -m "Add temporary index structure map"
          git push
