name: Apply public page improvements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-public-improvements.yml"

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update public page and create admin entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          marker = 'v31-public-sales-admin-split'

          if marker not in html:
              css = r'''
          <style id="v31-public-sales-admin-split">
          /* Public offer, concise itinerary and separate admin entry */
          .offer-section{padding:28px 0 12px}
          .offer-shell{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:stretch;padding:25px;border:1px solid rgba(7,29,56,.09);border-radius:26px;background:linear-gradient(135deg,#fff 0%,#f5f9fc 58%,#fbf5e7 100%);box-shadow:var(--shadow);overflow:hidden}
          .offer-shell:before{content:"";position:absolute;width:220px;height:220px;left:-85px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(214,167,45,.18),transparent 68%);pointer-events:none}
          .offer-copy,.offer-price-panel{position:relative;z-index:1}
          .offer-kicker{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#eaf2f8;color:var(--navy);font-size:12px;font-weight:800}
          .offer-copy h2{margin:9px 0 7px;color:var(--navy);font-size:31px;line-height:1.35}
          .offer-copy>p{margin:0;color:#526274;max-width:770px}
          .offer-inclusions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:18px}
          .offer-inclusion{display:flex;align-items:flex-start;gap:8px;color:#263b50;font-size:13px;font-weight:700}
          .offer-inclusion:before{content:"✓";display:grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#e6f5ef;color:#147657;font-size:12px;font-weight:900}
          .offer-price-panel{display:flex;flex-direction:column;justify-content:center;border-radius:21px;padding:21px;background:linear-gradient(145deg,var(--navy),#0e3b66);color:#fff;text-align:center;border:1px solid rgba(214,167,45,.45)}
          .offer-price-label{font-size:13px;color:#d9e6f2;font-weight:700}
          .offer-price-wrap{position:relative;display:grid;place-items:center;min-height:68px;margin:4px 0 8px;overflow:hidden}
          .offer-price-value{font-size:31px;line-height:1;font-weight:900;color:#f2d88f;direction:rtl;white-space:nowrap;filter:blur(4.6px);opacity:.7;user-select:none;pointer-events:none}
          .offer-price-mask{position:absolute;inset:auto;z-index:2;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.92);color:#7f2335;border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 20px rgba(0,0,0,.18);font-size:12px;font-weight:900;transform:rotate(-2deg)}
          .offer-early{display:grid;gap:2px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13)}
          .offer-early span{font-size:11px;color:#dbe8f4}.offer-early strong{font-size:20px;color:#fff}.offer-early small{font-size:10.5px;color:#c9d8e6}
          .offer-disclaimer{margin:11px 0 0;color:#c9d8e6;font-size:10.5px;line-height:1.7}
          .offer-cta{display:inline-flex;align-items:center;justify-content:center;margin-top:13px;padding:10px 15px;border-radius:12px;background:#168b68;color:#fff;font-size:13px;font-weight:900;text-decoration:none}
          .offer-cta:hover{background:#117456;color:#fff;text-decoration:none}
          .program-preview-section{padding-top:24px}
          .program-coming-note{display:flex;align-items:flex-start;gap:10px;margin:0 0 17px;padding:13px 15px;border-radius:15px;border:1px solid #e8d49c;background:#fff8e7;color:#6f5518;font-size:13px;font-weight:700}
          .program-coming-note:before{content:"قريباً";flex:0 0 auto;padding:4px 8px;border-radius:999px;background:var(--gold);color:#fff;font-size:10px;font-weight:900}
          .program-preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
          .program-preview-card{position:relative;min-height:155px;padding:18px 18px 17px;border:1px solid #dce6ee;border-radius:19px;background:#fff;box-shadow:0 8px 21px rgba(7,29,56,.065);overflow:hidden}
          .program-preview-card:before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--preview-accent,#0c607c)}
          .program-preview-card .preview-number{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:10px;background:color-mix(in srgb,var(--preview-accent,#0c607c) 11%,white);color:var(--preview-accent,#0c607c);font-size:12px;font-weight:900}
          .program-preview-card h3{margin:10px 0 5px;color:var(--navy);font-size:17px;line-height:1.55}
          .program-preview-card p{margin:0;color:#5a6979;font-size:12.5px;line-height:1.75}
          body:not(.admin-route) #adminAccessBtn{display:none!important}
          body.admin-mode #program-preview-2026{display:none!important}
          body:not(.admin-mode) #program-public{display:none!important}
          @media(max-width:900px){.offer-shell{grid-template-columns:1fr}.program-preview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:640px){.offer-section{padding-top:18px}.offer-shell{padding:17px;border-radius:21px}.offer-copy h2{font-size:25px}.offer-inclusions,.program-preview-grid{grid-template-columns:1fr}.offer-price-panel{padding:18px}.offer-price-value{font-size:27px}.program-preview-card{min-height:auto}}
          </style>
          '''

              offer = r'''
          <section id="participation-offer" class="offer-section">
            <div class="container">
              <div class="offer-shell">
                <div class="offer-copy">
                  <span class="offer-kicker">باقة رحلة سيئول المعرفية 2026</span>
                  <h2>قيمة المشاركة وما تشمله الرحلة</h2>
                  <p>باقة مهنية ومعرفية متكاملة صممت لتمنح المشارك تجربة منظمة في سيئول، تجمع بين المعرض والزيارات واللقاءات والتجارب التطبيقية.</p>
                  <div class="offer-inclusions" aria-label="مزايا الباقة">
                    <div class="offer-inclusion">الإقامة طوال مدة البرنامج</div>
                    <div class="offer-inclusion">التنقلات الداخلية في سيئول</div>
                    <div class="offer-inclusion">الاستقبال من المطار عند الوصول</div>
                    <div class="offer-inclusion">البرنامج المهني والمعرفي</div>
                    <div class="offer-inclusion">الزيارات والأنشطة ورسوم الدخول المدرجة</div>
                    <div class="offer-inclusion">الوجبات وتجارب المطاعم والمقاهي المدرجة</div>
                    <div class="offer-inclusion">الترجمة والتنسيق الميداني</div>
                    <div class="offer-inclusion">لقاءات الوفد وورشة العمل التفاعلية</div>
                  </div>
                </div>
                <aside class="offer-price-panel" aria-label="قيمة المشاركة ستعلن قريباً">
                  <div class="offer-price-label">قيمة المشاركة الأساسية</div>
                  <div class="offer-price-wrap">
                    <div class="offer-price-value" aria-hidden="true">13,000 ريال</div>
                    <div class="offer-price-mask">الإعلان قريباً</div>
                  </div>
                  <div class="offer-early">
                    <span>عرض التسجيل المبكر</span>
                    <strong class="offer-price-value" aria-hidden="true">9,900 ريال</strong>
                    <small>حتى 15 أغسطس 2026</small>
                  </div>
                  <p class="offer-disclaimer">ستعلن القيمة النهائية بعد اكتمال التعاقدات واعتماد تفاصيل البرنامج.</p>
                  <a class="offer-cta" href="#registration">سجل اهتمامك بالرحلة</a>
                </aside>
              </div>
            </div>
          </section>
          '''

              program = r'''
          <section id="program-preview-2026" class="program-preview-section">
            <div class="container">
              <div class="section-head"><h2>ملامح البرنامج المهني والمعرفي</h2></div>
              <div class="program-coming-note">الجدول التفصيلي للرحلة قيد الإعداد، وسيُنشر قريباً بعد اعتماد مواعيد الزيارات واللقاءات مع الجهات المستضيفة.</div>
              <div class="program-preview-grid">
                <article class="program-preview-card" style="--preview-accent:#0c607c">
                  <span class="preview-number">01</span><h3>الوصول وتهيئة الوفد</h3><p>الاستقبال، التعارف، وتهيئة المشاركين للاستفادة القصوى من المعرض والزيارات المهنية.</p>
                </article>
                <article class="program-preview-card" style="--preview-accent:#c92843">
                  <span class="preview-number">02</span><h3>Cafe Show Seoul 2026</h3><p>جولات موجهة داخل المعرض، استكشاف المنتجات والحلول، ولقاءات مع الشركات والعارضين.</p>
                </article>
                <article class="program-preview-card" style="--preview-accent:#9a5d2c">
                  <span class="preview-number">03</span><h3>تجارب المقاهي والضيافة</h3><p>زيارات منتقاة لمقاه ومشاريع كورية للاطلاع على التجربة والتشغيل والابتكار في خدمة العملاء.</p>
                </article>
                <article class="program-preview-card" style="--preview-accent:#7457c8">
                  <span class="preview-number">04</span><h3>التقنية والروبوتات والذكاء الاصطناعي</h3><p>زيارات ولقاءات مهنية للتعرف على الحلول التقنية القابلة للتطبيق في قطاع المطاعم والمقاهي.</p>
                </article>
                <article class="program-preview-card" style="--preview-accent:#218467">
                  <span class="preview-number">05</span><h3>لقاء الضيافة في سيئول</h3><p>لقاء مهني يجمع الوفد لتبادل التجارب، مناقشة الفرص، وبناء علاقات وتعاونات تمتد لما بعد الرحلة.</p>
                </article>
                <article class="program-preview-card" style="--preview-accent:#b57600">
                  <span class="preview-number">06</span><h3>ورشة تفاعلية: هندسة الشراكات التجارية</h3><p>تحويل الفرص المكتشفة خلال الرحلة إلى نماذج تعاون وخطوات عملية قابلة للتنفيذ بعد العودة.</p>
                </article>
              </div>
            </div>
          </section>
          '''

              route_script = r'''
          <script id="v31-admin-route-script">
          (()=>{
            const isAdminRoute=new URLSearchParams(location.search).get('admin')==='1';
            document.documentElement.classList.toggle('admin-route',isAdminRoute);
            const boot=()=>{
              document.body.classList.toggle('admin-route',isAdminRoute);
              const button=document.getElementById('adminAccessBtn');
              if(!button)return;
              button.hidden=!isAdminRoute;
              if(isAdminRoute&&!document.body.classList.contains('admin-mode')){
                window.setTimeout(()=>button.click(),450);
              }
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
          })();
          </script>
          '''

              if '</head>' not in html:
                  raise SystemExit('Could not locate </head>')
              html = html.replace('</head>', css + '\n</head>', 1)

              main_match = re.search(r'<main\b[^>]*>', html, flags=re.I)
              if not main_match:
                  raise SystemExit('Could not locate <main>')
              html = html[:main_match.end()] + '\n' + offer + html[main_match.end():]

              registration = re.search(r'<section\b[^>]*\bid=["\']registration["\'][^>]*>', html, flags=re.I)
              if registration:
                  html = html[:registration.start()] + program + '\n' + html[registration.start():]
              else:
                  end_main = html.lower().rfind('</main>')
                  if end_main < 0:
                      raise SystemExit('Could not locate program insertion point')
                  html = html[:end_main] + program + '\n' + html[end_main:]

              if '</body>' not in html:
                  raise SystemExit('Could not locate </body>')
              html = html.replace('</body>', route_script + '\n</body>', 1)
              index_path.write_text(html, encoding='utf-8')

          admin_html = '''<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>لوحة إدارة رحلة سيئول 2026</title>
            <meta name="robots" content="noindex,nofollow">
            <meta http-equiv="refresh" content="0;url=./?admin=1">
            <style>
              *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef3f7;color:#071d38;font-family:Tahoma,Arial,sans-serif}.box{max-width:420px;padding:26px;border:1px solid #d8e2eb;border-radius:20px;background:#fff;text-align:center;box-shadow:0 14px 35px rgba(7,29,56,.1)}a{color:#174b8b;font-weight:700}
            </style>
            <script>location.replace('./?admin=1');</script>
          </head>
          <body><main class="box"><strong>جاري فتح لوحة الإدارة…</strong><p><a href="./?admin=1">فتح لوحة الإدارة</a></p></main></body>
          </html>
          '''
          Path('admin.html').write_text(admin_html, encoding='utf-8')
          PY

      - name: Commit published changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Improve public offer and program; separate admin entry"
          git push
